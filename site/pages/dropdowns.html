<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dropdowns practice</title>
  <style>
    [role=listbox] { list-style: none; margin: 0; padding: 0; border: 1px solid #999; max-width: 16em; }
    [role=option] { padding: 2px 6px; cursor: pointer; }
    [role=option][aria-selected=true] { background: #dde; }
    [role=option][aria-disabled=true] { color: #999; cursor: default; }
  </style>
</head>
<body>
<!--FLASH-->
<!-- Lesson 04. Three kinds of dropdown: a native <select>, a custom one built
     from a button and a list, and a searchable one whose options arrive late.
     Every choice is written into #log. -->
<h1>Dropdowns practice</h1>

<section>
  <h2>Native select</h2>
  <label for="currency">Currency</label>
  <select id="currency">
    <option value="">Choose a currency</option>
    <option value="eur">Euro (EUR)</option>
    <option value="usd">US dollar (USD)</option>
    <option value="ron">Romanian leu (RON)</option>
    <option value="gbp">British pound (GBP)</option>
  </select>

  <label for="channels">Notify me by</label>
  <select id="channels" multiple>
    <option value="email">Email</option>
    <option value="sms">SMS</option>
    <option value="push">Push notification</option>
  </select>
</section>

<section>
  <h2>Custom dropdown</h2>
  <!-- Not a <select>: a button that opens a list. selectOption cannot drive it;
       a user clicks it open and clicks an option, and so does the test. -->
  <button type="button" id="account" aria-label="From account"
          aria-haspopup="listbox" aria-expanded="false" aria-controls="account-list">Choose an account</button>
  <ul id="account-list" role="listbox" aria-label="Accounts" hidden>
    <li role="option" aria-selected="false">Current account</li>
    <li role="option" aria-selected="false">Savings account</li>
    <li role="option" aria-selected="false" aria-disabled="true">Joint account (blocked)</li>
  </ul>
</section>

<section>
  <h2>Searchable dropdown</h2>
  <!-- The options are looked up 300 ms after the last keystroke, the way a
       real one asks a server. Nothing is in the list until then. -->
  <label for="beneficiary">Beneficiary</label>
  <input id="beneficiary" type="text" role="combobox" autocomplete="off"
         aria-autocomplete="list" aria-expanded="false" aria-controls="beneficiary-list">
  <ul id="beneficiary-list" role="listbox" aria-label="Beneficiaries" hidden></ul>
  <p id="no-matches" hidden>No matches</p>
</section>

<p id="log" aria-live="polite"></p>

<script>
  var log = document.getElementById('log');
  function say(text) { log.textContent = text; }

  // --- native select ---------------------------------------------------
  document.getElementById('currency').addEventListener('change', function (e) {
    say('currency: ' + e.target.value);
  });
  document.getElementById('channels').addEventListener('change', function (e) {
    var chosen = Array.prototype.map.call(e.target.selectedOptions, function (o) { return o.value; });
    say('channels: ' + chosen.join(', '));
  });

  // --- custom dropdown -------------------------------------------------
  var account = document.getElementById('account');
  var accountList = document.getElementById('account-list');

  function setOpen(open) {
    accountList.hidden = !open;
    account.setAttribute('aria-expanded', String(open));
  }
  account.addEventListener('click', function () { setOpen(accountList.hidden); });
  accountList.querySelectorAll('[role=option]').forEach(function (option) {
    option.addEventListener('click', function () {
      if (option.getAttribute('aria-disabled') === 'true') { return; }
      accountList.querySelectorAll('[role=option]').forEach(function (o) {
        o.setAttribute('aria-selected', String(o === option));
      });
      account.textContent = option.textContent;
      setOpen(false);
      say('account: ' + option.textContent);
    });
  });
  // A click anywhere else closes it, like a real dropdown.
  document.addEventListener('click', function (e) {
    if (!account.contains(e.target) && !accountList.contains(e.target)) { setOpen(false); }
  });

  // --- searchable dropdown ---------------------------------------------
  var NAMES = ['Ana Pop', 'Ioana Marin', 'Ion Rusu', 'Maria Ionescu', 'Mihai Popa', 'Andrei Stan'];
  var input = document.getElementById('beneficiary');
  var list = document.getElementById('beneficiary-list');
  var noMatches = document.getElementById('no-matches');
  var timer = null;
  var active = -1;

  function close() {
    list.hidden = true;
    noMatches.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    active = -1;
  }
  function choose(name) {
    input.value = name;
    close();
    say('beneficiary: ' + name);
  }
  function highlight(index) {
    var options = list.querySelectorAll('[role=option]');
    if (!options.length) { return; }
    active = (index + options.length) % options.length;
    options.forEach(function (o, i) { o.setAttribute('aria-selected', String(i === active)); });
  }
  function render(query) {
    var q = query.trim().toLowerCase();
    list.innerHTML = '';
    active = -1;
    if (!q) { close(); return; }
    var found = NAMES.filter(function (n) { return n.toLowerCase().indexOf(q) !== -1; });
    found.forEach(function (name) {
      var li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', 'false');
      li.textContent = name;
      li.addEventListener('click', function () { choose(name); });
      list.appendChild(li);
    });
    list.hidden = found.length === 0;
    noMatches.hidden = found.length !== 0;
    input.setAttribute('aria-expanded', String(found.length !== 0));
  }

  // 'input' fires for fill() and for real typing alike.
  input.addEventListener('input', function () {
    clearTimeout(timer);
    var query = input.value;
    timer = setTimeout(function () { render(query); }, 300);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight(active + 1); }
    // From no highlight, ArrowUp goes to the last option.
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight((active < 0 ? 0 : active) - 1); }
    else if (e.key === 'Enter' && active >= 0) {
      e.preventDefault();
      choose(list.querySelectorAll('[role=option]')[active].textContent);
    }
    else if (e.key === 'Escape') { close(); }
  });
</script>
</body>
</html>
